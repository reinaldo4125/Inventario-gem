version: '3.8'
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: TuPasswordSeguro
      MYSQL_DATABASE: multinyectores
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=TuPasswordSeguro
      - DB_NAME=multinyectores
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  db_data:
