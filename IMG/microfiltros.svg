<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);">
  <!-- Microfiltro de combustible -->
  <defs>
    <linearGradient id="filterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ecf0f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#bdc3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#95a5a6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="housingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34495e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo con patrón -->
  <circle cx="80" cy="60" r="2" fill="#004A99" opacity="0.1"/>
  <circle cx="320" cy="180" r="3" fill="#E32636" opacity="0.1"/>
  <circle cx="350" cy="80" r="1.5" fill="#1E73BE" opacity="0.1"/>
  
  <!-- Carcasa principal del filtro -->
  <rect x="150" y="100" width="100" height="60" rx="8" fill="url(#housingGradient)" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Conexiones de entrada y salida -->
  <rect x="130" y="120" width="25" height="20" rx="3" fill="url(#filterGradient)" stroke="#7f8c8d" stroke-width="1"/>
  <rect x="245" y="120" width="25" height="20" rx="3" fill="url(#filterGradient)" stroke="#7f8c8d" stroke-width="1"/>
  
  <!-- Elemento filtrante interno -->
  <rect x="160" y="110" width="80" height="40" rx="4" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
  
  <!-- Líneas del filtro interno -->
  <g stroke="#d35400" stroke-width="0.5">
    <line x1="165" y1="115" x2="235" y2="115"/>
    <line x1="165" y1="120" x2="235" y2="120"/>
    <line x1="165" y1="125" x2="235" y2="125"/>
    <line x1="165" y1="130" x2="235" y2="130"/>
    <line x1="165" y1="135" x2="235" y2="135"/>
    <line x1="165" y1="140" x2="235" y2="140"/>
    <line x1="165" y1="145" x2="235" y2="145"/>
  </g>
  
  <!-- Flujo de combustible -->
  <g opacity="0.7">
    <!-- Entrada -->
    <circle cx="125" cy="130" r="2" fill="#3498db"/>
    <circle cx="120" cy="130" r="1.5" fill="#3498db"/>
    <circle cx="115" cy="130" r="1" fill="#3498db"/>
    
    <!-- Salida -->
    <circle cx="275" cy="130" r="2" fill="#27ae60"/>
    <circle cx="280" cy="130" r="1.5" fill="#27ae60"/>
    <circle cx="285" cy="130" r="1" fill="#27ae60"/>
  </g>
  
  <!-- Tornillos de sujeción -->
  <circle cx="160" cy="110" r="3" fill="#7f8c8d" stroke="#34495e" stroke-width="1"/>
  <circle cx="240" cy="110" r="3" fill="#7f8c8d" stroke="#34495e" stroke-width="1"/>
  <circle cx="160" cy="150" r="3" fill="#7f8c8d" stroke="#34495e" stroke-width="1"/>
  <circle cx="240" cy="150" r="3" fill="#7f8c8d" stroke="#34495e" stroke-width="1"/>
  
  <!-- Líneas en los tornillos -->
  <g stroke="#34495e" stroke-width="0.5">
    <line x1="158" y1="108" x2="162" y2="112"/>
    <line x1="238" y1="108" x2="242" y2="112"/>
    <line x1="158" y1="148" x2="162" y2="152"/>
    <line x1="238" y1="148" x2="242" y2="152"/>
  </g>
  
  <!-- Etiqueta del filtro -->
  <rect x="170" y="170" width="60" height="15" rx="2" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="200" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2c3e50">FUEL FILTER</text>
  
  <!-- Texto identificativo -->
  <text x="200" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#004A99">MICROFILTRO</text>
  <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Filtro de Combustible</text>
  
  <!-- Elementos decorativos -->
  <rect x="10" y="10" width="80" height="2" fill="#E32636" opacity="0.8"/>
  <rect x="310" y="280" width="80" height="2" fill="#E32636" opacity="0.8"/>
  
  <!-- Indicadores de flujo -->
  <polygon points="110,125 105,130 110,135" fill="#3498db" opacity="0.6"/>
  <polygon points="290,125 295,130 290,135" fill="#27ae60" opacity="0.6"/>
</svg>