<svg width="120" height="48" viewBox="0 0 120 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo del logo -->
  <rect width="120" height="48" rx="6" fill="#004A99"/>
  
  <!-- Elemento gráfico - Inyector estilizado -->
  <g transform="translate(8, 8)">
    <!-- Cuerpo del inyector -->
    <rect x="0" y="6" width="5" height="24" rx="1" fill="#E32636"/>
    <rect x="1" y="4" width="3" height="3" fill="#1E73BE"/>
    
    <!-- Conector -->
    <rect x="5" y="9" width="8" height="4" rx="2" fill="#1E73BE"/>
    <circle cx="13" r="1.5" cy="11" fill="#E32636"/>
    
    <!-- Spray pattern -->
    <g opacity="0.8">
      <circle cx="2.5" cy="32" r="0.8" fill="#FFFFFF"/>
      <circle cx="4" cy="33" r="0.6" fill="#FFFFFF"/>
      <circle cx="1" cy="34" r="0.4" fill="#FFFFFF"/>
    </g>
  </g>
  
  <!-- Texto principal -->
  <text x="28" y="22" font-family="Montserrat, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF">
    MULTINYECTORES
  </text>
  
  <!-- Subtítulo -->
  <text x="28" y="32" font-family="Poppins, sans-serif" font-weight="500" font-size="6" fill="#1E73BE" opacity="0.9">
    INYECCIÓN ELECTRÓNICA
  </text>
  
  <!-- Línea decorativa -->
  <line x1="28" y1="35" x2="108" y2="35" stroke="#E32636" stroke-width="1"/>
  
  <!-- Elementos técnicos -->
  <g transform="translate(95, 12)">
    <!-- Circuito estilizado -->
    <rect x="0" y="0" width="10" height="1" fill="#1E73BE" opacity="0.6"/>
    <rect x="3" y="1" width="1" height="5" fill="#1E73BE" opacity="0.6"/>
    <rect x="6" y="3" width="5" height="1" fill="#1E73BE" opacity="0.6"/>
    <circle cx="11" cy="3.5" r="1.2" fill="#E32636" opacity="0.8"/>
  </g>
</svg>