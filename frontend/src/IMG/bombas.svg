<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);">
  <!-- Bomba de combustible eléctrica -->
  <defs>
    <linearGradient id="pumpGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#34495e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="motorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7f8c8d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#95a5a6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo con patrón -->
  <circle cx="90" cy="70" r="3" fill="#004A99" opacity="0.1"/>
  <circle cx="310" cy="200" r="2" fill="#E32636" opacity="0.1"/>
  <circle cx="360" cy="90" r="1.5" fill="#1E73BE" opacity="0.1"/>
  
  <!-- Cuerpo principal de la bomba -->
  <ellipse cx="200" cy="150" rx="80" ry="50" fill="url(#pumpGradient)" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Motor eléctrico -->
  <rect x="170" y="120" width="60" height="35" rx="5" fill="url(#motorGradient)" stroke="#7f8c8d" stroke-width="1"/>
  
  <!-- Conexiones eléctricas -->
  <rect x="160" y="110" width="8" height="15" fill="#E32636"/>
  <rect x="232" y="110" width="8" height="15" fill="#000"/>
  <text x="164" y="108" font-family="Arial, sans-serif" font-size="8" fill="#E32636">+</text>
  <text x="236" y="108" font-family="Arial, sans-serif" font-size="8" fill="#000">-</text>
  
  <!-- Entrada de combustible -->
  <rect x="150" y="140" width="25" height="20" rx="3" fill="#7f8c8d" stroke="#5d6d7e" stroke-width="1"/>
  <circle cx="140" cy="150" r="4" fill="#3498db" opacity="0.7"/>
  <text x="110" y="155" font-family="Arial, sans-serif" font-size="10" fill="#3498db">IN</text>
  
  <!-- Salida de combustible -->
  <rect x="225" y="140" width="25" height="20" rx="3" fill="#7f8c8d" stroke="#5d6d7e" stroke-width="1"/>
  <circle cx="260" cy="150" r="4" fill="#27ae60" opacity="0.7"/>
  <text x="270" y="155" font-family="Arial, sans-serif" font-size="10" fill="#27ae60">OUT</text>
  
  <!-- Rotor interno -->
  <circle cx="200" cy="137" r="12" fill="#34495e" stroke="#2c3e50" stroke-width="1"/>
  <circle cx="200" cy="137" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
  
  <!-- Aspas del rotor -->
  <g stroke="#2c3e50" stroke-width="1" fill="#34495e">
    <polygon points="200,129 204,133 200,137 196,133"/>
    <polygon points="208,137 204,141 200,137 204,133"/>
    <polygon points="200,145 196,141 200,137 204,141"/>
    <polygon points="192,137 196,133 200,137 196,141"/>
  </g>
  
  <!-- Carcasa externa -->
  <path d="M 140 120 Q 130 150 140 180 Q 200 190 260 180 Q 270 150 260 120 Q 200 110 140 120" 
        fill="none" stroke="#2c3e50" stroke-width="2" opacity="0.3"/>
  
  <!-- Presión de salida -->
  <g opacity="0.6">
    <circle cx="275" cy="150" r="3" fill="#f39c12"/>
    <circle cx="285" cy="150" r="2" fill="#f39c12"/>
    <circle cx="292" cy="150" r="1" fill="#f39c12"/>
  </g>
  
  <!-- Tuberías -->
  <rect x="115" y="145" width="30" height="10" rx="5" fill="#7f8c8d" stroke="#5d6d7e" stroke-width="1"/>
  <rect x="255" y="145" width="30" height="10" rx="5" fill="#7f8c8d" stroke="#5d6d7e" stroke-width="1"/>
  
  <!-- Soporte de montaje -->
  <rect x="180" y="185" width="40" height="8" rx="2" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1"/>
  <circle cx="185" cy="189" r="2" fill="#34495e"/>
  <circle cx="215" cy="189" r="2" fill="#34495e"/>
  
  <!-- Texto identificativo -->
  <text x="200" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#004A99">BOMBA DE COMBUSTIBLE</text>
  <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Bomba Eléctrica de Alta Presión</text>
  
  <!-- Elementos decorativos -->
  <rect x="10" y="10" width="80" height="2" fill="#E32636" opacity="0.8"/>
  <rect x="310" y="280" width="80" height="2" fill="#E32636" opacity="0.8"/>
  
  <!-- Indicador de presión -->
  <text x="200" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">3-4 BAR</text>
</svg>