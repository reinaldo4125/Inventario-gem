<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular -->
  <circle cx="16" cy="16" r="16" fill="#004A99"/>
  
  <!-- Inyector estilizado -->
  <g transform="translate(10, 8)">
    <!-- Cuerpo del inyector -->
    <rect x="0" y="2" width="3" height="12" rx="1" fill="#E32636"/>
    <rect x="0.5" y="1" width="2" height="2" fill="#1E73BE"/>
    
    <!-- Conector -->
    <rect x="3" y="4" width="5" height="2" rx="1" fill="#1E73BE"/>
    <circle cx="8" cy="5" r="1" fill="#E32636"/>
    
    <!-- Spray -->
    <g opacity="0.8">
      <circle cx="1.5" cy="16" r="0.5" fill="#FFFFFF"/>
      <circle cx="2.5" cy="17" r="0.3" fill="#FFFFFF"/>
      <circle cx="0.5" cy="17.5" r="0.2" fill="#FFFFFF"/>
    </g>
  </g>
  
  <!-- Letra M estilizada -->
  <text x="16" y="20" font-family="Montserrat, sans-serif" font-weight="800" font-size="8" fill="#FFFFFF" text-anchor="middle">
    M
  </text>
</svg>