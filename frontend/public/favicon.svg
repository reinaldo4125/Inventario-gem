<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#3b82f6" stroke-width="6" opacity="0.3" />

  <!-- Stylized Diesel Injector Icon -->
  <g transform="translate(256, 256)">
    <!-- Main nozzle body -->
    <path d="M-36,-130 L36,-130 L28,-60 L20,100 L0,150 L-20,100 L-28,-60 Z" fill="url(#accentGrad)" filter="url(#glow)" />
    
    <!-- Red high-pressure collar -->
    <rect x="-44" y="-80" width="88" height="28" rx="8" fill="url(#redGrad)" />
    
    <!-- Top connector plug -->
    <rect x="-24" y="-160" width="48" height="30" rx="6" fill="#e2e8f0" />
    <path d="M-12,-180 L12,-180 L12,-160 L-12,-160 Z" fill="#94a3b8" />

    <!-- Fuel pressure rings -->
    <rect x="-22" y="-20" width="44" height="12" rx="4" fill="#ffffff" opacity="0.9" />
    <rect x="-18" y="20" width="36" height="10" rx="3" fill="#ffffff" opacity="0.7" />

    <!-- Atomized Fuel Spray Particles -->
    <circle cx="0" cy="180" r="10" fill="#60a5fa" opacity="0.9" />
    <circle cx="-28" cy="195" r="7" fill="#93c5fd" opacity="0.8" />
    <circle cx="28" cy="195" r="7" fill="#93c5fd" opacity="0.8" />
    <circle cx="-52" cy="215" r="5" fill="#bfdbfe" opacity="0.6" />
    <circle cx="52" cy="215" r="5" fill="#bfdbfe" opacity="0.6" />
    <circle cx="0" cy="220" r="8" fill="#60a5fa" opacity="0.7" />
  </g>
</svg>
